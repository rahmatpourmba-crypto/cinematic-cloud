name: studio-render

# The prompt studio, 100% on GitHub: a new issue with the magic marker
# "<!-- studio-job -->" triggers a render on the runner; the result is
# committed to gh-pages (which GitHub Pages serves). The gh-pages branch is
# rebuilt deterministically from scratch on every publish so it never
# accumulates stale repo files.

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: studio-render
  cancel-in-progress: false

jobs:
  studio:
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'
    timeout-minutes: 115
    env:
      USE_GOOGLE_IMAGEN: "0"
      USE_GOOGLE_TTS: "0"

    steps:
      - name: Gate — studio marker?
        id: gate
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'EOF'
          import os
          body = os.environ.get("ISSUE_BODY", "")
          print("len(body):", len(body))
          print("is_studio:", body.startswith("<!-- studio-job -->"))
          with open(os.environ.get("GITHUB_OUTPUT", "ghout"), "a") as f:
              f.write("is_studio=" + ("true" if body.startswith("<!-- studio-job -->") else "false") + "\n")
          EOF

      - uses: actions/checkout@v4
        if: steps.gate.outputs.is_studio == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.is_studio == 'true'
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.is_studio == 'true'
        with:
          python-version: '3.11'

      - name: Install deps
        if: steps.gate.outputs.is_studio == 'true'
        run: |
          pip install -r requirements.txt
          npm ci
          npx remotion browser ensure

      - name: Parse job payload
        if: steps.gate.outputs.is_studio == 'true'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'EOF'
          import json, os
          lines = os.environ["ISSUE_BODY"].splitlines()
          d = json.loads(lines[1].strip())
          json.dump(d, open("payload.json", "w", encoding="utf-8"), ensure_ascii=False)
          print("id     =", d["id"])
          print("style  =", d.get("style"))
          print("quality=", d.get("quality"))
          print("prompt =", d["prompt"][:80])
          EOF

      - name: Render video (+images + narration)
        if: steps.gate.outputs.is_studio == 'true'
        run: python scripts/studio_gh.py payload.json

      - name: Publish to gh-pages (deterministic rebuild)
        if: steps.gate.outputs.is_studio == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ART=.studio_artifacts.json
          test -f "$ART"
          JID=$(python -c "import json;print(json.load(open('$ART'))['id'])")
          VID=$(python -c "import json;print(json.load(open('$ART'))['video'])")
          POSTER=$(python -c "import json;print(json.load(open('$ART'))['poster'])")
          IMG=out/"$VID"; PNG=out/"$POSTER"
          REPO="$GITHUB_REPOSITORY"
          RAW="https://raw.githubusercontent.com/$REPO/gh-pages/videos"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf _page && mkdir -p _page/jobs _page/videos
          cp -f public/studio/index.html public/studio/style.css public/studio/app.js _page/
          touch _page/.nojekyll
          mkdir -p "_page/videos/$JID"
          cp -f "$IMG" "_page/videos/$JID/video.mp4"
          cp -f "$PNG" "_page/videos/$JID/poster.jpg"

          curl -sfL "$RAW/index.json" -o _page/videos/index.json 2>/dev/null || echo '[]' > _page/videos/index.json

          python - <<'EOF'
          import json, datetime
          art = json.load(open('.studio_artifacts.json', encoding='utf-8'))
          jid = art['id']
          entry = {
              "id": jid,
              "status": art["status"],
              "prompt": art["prompt"],
              "video": f"videos/{jid}/video.mp4",
              "poster": f"videos/{jid}/poster.jpg",
              "error": art.get("error"),
              "created": datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M"),
          }
          idx = []
          try:
              idx = json.load(open('_page/videos/index.json', encoding='utf-8'))
              if not isinstance(idx, list):
                  idx = []
          except Exception:
              idx = []
          idx = [x for x in idx if x.get("id") != jid]
          idx.insert(0, entry)
          idx = idx[:24]
          with open('_page/videos/index.json', 'w', encoding='utf-8') as f:
              json.dump(idx, f, ensure_ascii=False)
          for x in idx:
              pid = x["id"]
              with open(f'_page/jobs/{pid}.json', 'w', encoding='utf-8') as f:
                  json.dump(x, f, ensure_ascii=False)
          EOF

          # Restore retained videos so the rebuilt branch keeps them (best
          # effort; entries whose files can't be fetched are dropped).
          python - <<'EOF'
          import json, os, shutil, subprocess
          repo = os.environ["GITHUB_REPOSITORY"]
          idx = json.load(open('_page/videos/index.json', encoding='utf-8'))
          keep = []
          for v in idx:
              if v["status"] != "done":
                  continue
              pid = v["id"]
              d = f'_page/videos/{pid}'
              os.makedirs(d, exist_ok=True)
              ok = True
              for f in ("video.mp4", "poster.jpg"):
                  if not os.path.exists(f'{d}/{f}'):
                      r = subprocess.run(
                          ["curl", "-sfL",
                           f"https://raw.githubusercontent.com/{repo}/gh-pages/videos/{pid}/{f}",
                           "-o", f'{d}/{f}'])
                      if r.returncode != 0:
                          ok = False
                          break
              if ok:
                  keep.append(v)
          with open('_page/videos/index.json', 'w', encoding='utf-8') as f:
              json.dump(keep, f, ensure_ascii=False)
          for v in idx:
              if v not in keep:
                  shutil.rmtree(f'_page/videos/{v["id"]}', ignore_errors=True)
                  if os.path.exists(f'_page/jobs/{v["id"]}.json'):
                      os.remove(f'_page/jobs/{v["id"]}.json')
          EOF

          git checkout --orphan gh-pages 2>/dev/null || true
          git rm -rf . --quiet >/dev/null 2>&1 || true
          # Copy ONLY the site files to repo root (do NOT bring node_modules, out, etc.)
          cp -f _page/index.html _page/style.css _page/app.js .
          cp -f _page/.nojekyll .
          cp -rf _page/videos _page/jobs .
          rm -rf _page
          git add -- index.html style.css app.js .nojekyll videos jobs
          if ! git diff --cached --quiet; then
            git commit -m "studio: publish $JID"
            git push origin gh-pages --force
          fi

      - name: Comment on issue
        if: steps.gate.outputs.is_studio == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PAGE_URL="https://rahmatpourmba-crypto.github.io/cinematic-cloud"
          if [ -f .studio_artifacts.json ]; then
            JID=$(python -c "import json;print(json.load(open('.studio_artifacts.json'))['id'])")
            ST=$(python -c "import json;print(json.load(open('.studio_artifacts.json'))['status'])")
            if [ "$ST" = "done" ]; then
              MSG=$(printf '%s\n' \
                "✅ ویدیوی شما آماده است! 🎬" \
                "پیشنمایش در استودیو: $PAGE_URL/" \
                "دانلود مستقیم: $PAGE_URL/videos/$JID/video.mp4")
            else
              MSG="⚠️ رندر ناموفق بود. جزئیات در لاگ workflow."
            fi
          else
            MSG="⚠️ رندر شروع نشد (خطا در مراحل آماده‌سازی)."
          fi
          gh api -X POST \
            "repos/rahmatpourmba-crypto/cinematic-cloud/issues/${{ github.event.issue.number }}/comments" \
            -f body="$MSG" >/dev/null